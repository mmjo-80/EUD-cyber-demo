name: Validate CyberLab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js && node tests/check.mjs
      - run: sh -n scripts/update.sh
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm cyberlab nginx -t
      - run: docker compose up -d --wait
      - run: |
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/ | grep 'SIMULATION'
          curl --fail http://localhost:8080/app.js > /dev/null
          curl --fail http://localhost:8080/style.css > /dev/null
          curl --fail --head http://localhost:8080/ | grep -i 'connect-src'
      - if: always()
        run: docker compose logs && docker compose down
